```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Lab Reservation</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-3xl mx-auto px-4 py-10">

        <div class="bg-white rounded-lg shadow-md p-6 md:p-8">

            <div class="mb-7">
                <h1 class="text-2xl font-bold text-gray-800">
                    Computer Lab Reservation
                </h1>
                <p class="text-gray-500 mt-1">
                    Please fill in the form to reserve the computer laboratory.
                </p>
            </div>

            <form>

                <!-- Borrower's Name -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Borrower's Name
                    </label>
                    <input
                        type="text"
                        placeholder="Enter your name"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 outline-none focus:border-blue-500"
                    >
                </div>

                <!-- Status -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Status
                    </label>

                    <div class="flex flex-wrap gap-5">
                        <label class="flex items-center gap-2">
                            <input type="radio" name="status" value="teacher">
                            <span>Teacher</span>
                        </label>

                        <label class="flex items-center gap-2">
                            <input type="radio" name="status" value="student">
                            <span>Student</span>
                        </label>

                        <label class="flex items-center gap-2">
                            <input type="radio" name="status" value="organization">
                            <span>Organization</span>
                        </label>
                    </div>
                </div>

                <!-- Purpose -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Purpose
                    </label>
                    <input
                        type="text"
                        placeholder="Practicum, Practice, OSIS Meeting, etc."
                        class="w-full border border-gray-300 rounded-md px-3 py-2 outline-none focus:border-blue-500"
                    >
                </div>

                <!-- Borrowed Lab -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Borrowed Lab
                    </label>

                    <select
                        class="w-full border border-gray-300 rounded-md px-3 py-2 bg-white outline-none focus:border-blue-500"
                    >
                        <option value="">Select laboratory</option>
                        <option value="lab1">Lab 1 - Software</option>
                        <option value="lab2">Lab 2 - Hardware</option>
                    </select>
                </div>

                <!-- Date -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Date of Use
                    </label>

                    <input
                        type="date"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 outline-none focus:border-blue-500"
                    >
                </div>

                <!-- Time -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Start Time
                        </label>

                        <input
                            type="time"
                            class="w-full border border-gray-300 rounded-md px-3 py-2 outline-none focus:border-blue-500"
                        >
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            End Time
                        </label>

                        <input
                            type="time"
                            class="w-full border border-gray-300 rounded-md px-3 py-2 outline-none focus:border-blue-500"
                        >
                    </div>

                </div>

                <!-- Number of Participants -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Number of Participants
                    </label>

                    <input
                        type="number"
                        min="1"
                        placeholder="Enter number of participants"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 outline-none focus:border-blue-500"
                    >
                </div>

                <!-- Special Requirements -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Special Requirements
                    </label>

                    <textarea
                        rows="4"
                        placeholder="Need internet access, need a projector, etc."
                        class="w-full border border-gray-300 rounded-md px-3 py-2 outline-none resize-none focus:border-blue-500"
                    ></textarea>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-md hover:bg-blue-700 transition"
                >
                    Submit Reservation
                </button>

            </form>

        </div>

        <p class="text-center text-sm text-gray-500 mt-5">
            Computer Laboratory Reservation System
        </p>

    </div>

</body>
</html>
```
